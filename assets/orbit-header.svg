<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">XIANYU — Small tools. Otherworldly ideas.</title>
  <desc id="desc">A midnight blue personal banner with cream typography and a small mint fish exploring an elegant orbit inside a space helmet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B29"/>
      <stop offset="0.55" stop-color="#101B2B"/>
      <stop offset="1" stop-color="#142C37"/>
    </linearGradient>
    <radialGradient id="atmosphere" cx="0" cy="0" r="1" gradientTransform="translate(1002 190) rotate(90) scale(218 284)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#85DDC3" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#85DDC3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="922" y1="109" x2="1068" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7F3DC" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#C7F3DC" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="fish" x1="938" y1="161" x2="1058" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6F0D7"/>
      <stop offset="1" stop-color="#A4DDC2"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1279" height="399" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" rx="24" fill="url(#background)"/>
    <rect width="1280" height="400" fill="url(#atmosphere)"/>
    <circle cx="1022" cy="189" r="294" stroke="#AFD7CF" stroke-opacity="0.045"/>
    <circle cx="1022" cy="189" r="249" stroke="#AFD7CF" stroke-opacity="0.06"/>

    <!-- A small editorial masthead, with generous breathing room. -->
    <circle cx="75" cy="52" r="3" fill="#AFDCC6"/>
    <text x="90" y="56" fill="#A3B9BD" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="2.7">AN ORBIT OF MY OWN</text>
    <path d="M72 82H134" stroke="#9FCDBA" stroke-opacity="0.6"/>

    <text x="67" y="185" fill="#F2EEDB" font-family="Arial, Helvetica, sans-serif" font-size="101" font-weight="700" letter-spacing="-5.5">XIANYU</text>
    <text x="72" y="239" fill="#E5EBDE" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" letter-spacing="-0.35">Small tools. Otherworldly ideas.</text>
    <text x="73" y="329" fill="#A0B5BA" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" letter-spacing="1.75">AI / INTERACTIVE WORLDS / CREATIVE TOOLS</text>

    <!-- Orbital linework and an original space-fish insignia. -->
    <ellipse cx="1001" cy="191" rx="218" ry="68" transform="rotate(-29 1001 191)" stroke="#93CBB9" stroke-opacity="0.25" stroke-width="1.2"/>
    <path d="M818 304C867 276 930 244 1006 203C1083 162 1145 127 1183 101" stroke="#B8DECE" stroke-opacity="0.13" stroke-dasharray="2 9"/>
    <circle cx="1000" cy="191" r="105" fill="#132831" stroke="#A9DBC8" stroke-opacity="0.46" stroke-width="1.25"/>
    <circle cx="1000" cy="191" r="94" fill="url(#glass)" stroke="#BDE9D5" stroke-opacity="0.15"/>
    <path d="M929 165C939 137 961 120 987 118" stroke="#E7F1DB" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>
    <path d="M927 177L925 186" stroke="#E7F1DB" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>

    <!-- Fish: folded tail, one soft body, and a small curious eye. -->
    <path d="M963 189L936 171C935 181 939 190 945 195C939 202 936 210 937 220L965 201" fill="#AFDCC6"/>
    <path d="M958 194C976 166 1006 158 1036 172C1049 178 1059 188 1063 194C1053 212 1034 227 1010 226C988 226 970 213 958 194Z" fill="url(#fish)"/>
    <path d="M985 171C991 158 1002 153 1014 155L1007 168" fill="#AFDCC6"/>
    <path d="M992 222L1011 234L1018 225" fill="#A3D4BB"/>
    <path d="M1007 187C1003 194 1004 202 1009 208" stroke="#3C796B" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="1038" cy="189" r="3.2" fill="#15313A"/>
    <circle cx="1039" cy="188" r="0.9" fill="#F2EEDB"/>
    <path d="M978 194L990 186L989 204Z" fill="#7DBFA6"/>
    <path d="M1055 202L1060 200" stroke="#427D70" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Helmet collar and tiny hardware details. -->
    <path d="M974 293H1026L1031 303H969L974 293Z" fill="#18333D" stroke="#A9DBC8" stroke-opacity="0.48"/>
    <path d="M981 298H1019" stroke="#BFE3CF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <rect x="888" y="179" width="9" height="25" rx="4" fill="#203D46" stroke="#A9DBC8" stroke-opacity="0.48"/>
    <rect x="1103" y="179" width="9" height="25" rx="4" fill="#203D46" stroke="#A9DBC8" stroke-opacity="0.48"/>

    <!-- Foreground orbit arc ties the drawing into the larger composition. -->
    <path d="M837 309C864 329 953 309 1052 256C1157 199 1224 139 1211 107" stroke="#BCDFC8" stroke-opacity="0.64" stroke-width="1.5"/>
    <circle cx="1162" cy="169" r="5" fill="#CBE6C8"/>
    <circle cx="1162" cy="169" r="10" stroke="#CBE6C8" stroke-opacity="0.15"/>

    <path d="M845 115V127M839 121H851" stroke="#D9E4CF" stroke-opacity="0.72" stroke-linecap="round"/>
    <circle cx="1129" cy="64" r="1.8" fill="#D9E4CF" fill-opacity="0.68"/>
    <circle cx="1181" cy="286" r="1.6" fill="#D9E4CF" fill-opacity="0.48"/>
    <circle cx="831" cy="216" r="1.2" fill="#D9E4CF" fill-opacity="0.35"/>
    <path d="M1117 330V338M1113 334H1121" stroke="#D9E4CF" stroke-opacity="0.43" stroke-linecap="round"/>

    <text x="1207" y="367" text-anchor="end" fill="#7F9FA4" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">STAY CURIOUS. KEEP DRIFTING.</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="24" stroke="#8DAEA8" stroke-opacity="0.16"/>
</svg>
